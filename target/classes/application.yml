server:
  port: 8080

spring:
  application:
    name: sky-employee-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/employee_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456  # 修改为你的MySQL密码
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

# JWT配置
whtc:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: wuhantongxiaoemployee2024secretkey
    # 设置jwt过期时间
    admin-ttl: 86400000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
    map-underscore-to-camel-case: true  # 下划线转驼峰
  global-config:
    db-config:
      id-type: auto  # 数据库自增ID
      logic-delete-field: isDeleted  # 逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 日志配置
logging:
  level:
    com.whtc.employee.mapper: debug
